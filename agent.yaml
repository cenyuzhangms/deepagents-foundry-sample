# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: deepagents-foundry-sample
description: |
  Deep Agents (planning + filesystem + sub-agents + shell) hosted on Foundry.
  Demonstrates that an existing langchain-ai/deepagents harness can be
  deployed to Foundry hosted agents with a small BaseAgent adapter.
protocols:
  - protocol: responses
    version: 1.0.0
environment_variables:
  - name: PROJECT_ENDPOINT
    value: ${AZURE_AI_PROJECT_ENDPOINT}
  - name: AZURE_OPENAI_ENDPOINT
    value: ${AZURE_OPENAI_ENDPOINT}
  - name: MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_OPENAI_API_VERSION
    value: "2025-04-01-preview"
  - name: OPTIMIZATION_LOCAL_DIR
    value: .agent_configs
  - name: OPTIMIZATION_CONFIG
    value: ${OPTIMIZATION_CONFIG}
  - name: OPTIMIZATION_CANDIDATE_ID
    value: ${OPTIMIZATION_CANDIDATE_ID}
  - name: OPTIMIZATION_RESOLVE_ENDPOINT
    value: ${OPTIMIZATION_RESOLVE_ENDPOINT}
